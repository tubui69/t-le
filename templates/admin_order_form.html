{% extends "base.html" %}
{% block title %}{{ 'Chinh sua don' if order else 'Tao don moi' }}{% endblock %}
{% block body %}
<div class="container">
    <header class="admin-header">
        <h1>{{ 'Chinh sua don #' + order.id|string if order else 'Tao don moi' }}</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Quay lai</a>
    </header>

    <form method="POST" class="form-card">
        <div class="form-group">
            <label for="order_type">Loai don *</label>
            <select id="order_type" name="order_type" required>
                <option value="xingtu" {% if order and order.order_type == 'xingtu' %}selected{% endif %}>Xingtu — Ma xac minh</option>
                <option value="duolingo" {% if order and order.order_type == 'duolingo' %}selected{% endif %}>Duolingo CDK — Ma nap Super</option>
                <option value="wink" {% if order and order.order_type == 'wink' %}selected{% endif %}>Wink — SDT + Ma code</option>
                <option value="wink_account" {% if order and order.order_type == 'wink_account' %}selected{% endif %}>Wink — SDT + MK + Ma code</option>
                <option value="meitu" {% if order and order.order_type == 'meitu' %}selected{% endif %}>Meitu — SDT + Ma code</option>
                <option value="meitu_account" {% if order and order.order_type == 'meitu_account' %}selected{% endif %}>Meitu — SDT + MK + Ma code</option>
            </select>
        </div>

        <div class="form-group">
            <label for="customer_name">Ten khach hang *</label>
            <input type="text" id="customer_name" name="customer_name"
                   value="{{ order.customer_name if order else '' }}"
                   placeholder="Nhap ten khach hang" required autofocus>
        </div>

        <div class="form-group">
            <label for="customer_phone">So dien thoai</label>
            <input type="text" id="customer_phone" name="customer_phone"
                   value="{{ order.customer_phone if order else '' }}"
                   placeholder="Nhap so dien thoai (tuy chon)">
        </div>

        <div class="form-group">
            <label for="note">Ghi chu</label>
            <textarea id="note" name="note" rows="3"
                      placeholder="Ghi chu ve don hang (tuy chon)">{{ order.note if order else '' }}</textarea>
        </div>

        <!-- Wink: Chon che do dang nhap -->
        <div class="form-group" id="wink-login-mode-group" style="display:none">
            <label for="login_mode">Che do dang nhap Wink *</label>
            <select id="login_mode" name="login_mode">
                <option value="otp">SDT + Ma OTP</option>
                <option value="password_otp">SDT + Mat khau + Nut lay OTP</option>
            </select>
        </div>

        <!-- Wink: Nhieu link dai ly -->
        <div class="form-group" id="wink-agent-links-group" style="display:none">
            <label for="agent_links">Link dai ly (moi dong 1 link)</label>
            <textarea id="agent_links" name="agent_links" rows="4"
                      placeholder="https://link-dai-ly-1.com&#10;https://link-dai-ly-2.com&#10;https://link-dai-ly-3.com | TenDaiLy"></textarea>
            <small style="color:#999;font-size:11px;margin-top:4px;display:block">
                Dinh dang: URL hoac URL | TenDaiLy. Moi dong la 1 link dai ly.
            </small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {{ 'Cap nhat' if order else 'Tao don' }}
            </button>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Huy</a>
        </div>
    </form>
</div>

<style>
select {
    width: 100%; padding: 10px 14px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; background: white;
}
</style>
<script>
(function(){
    var sel=document.getElementById('order_type');
    function toggleWink(){
        var isWink=(sel.value==='wink'||sel.value==='wink_account');
        document.getElementById('wink-login-mode-group').style.display=isWink?'block':'none';
        document.getElementById('wink-agent-links-group').style.display=isWink?'block':'none';
        // Auto set login_mode based on order_type
        if(sel.value==='wink_account'){
            document.getElementById('login_mode').value='password_otp';
        }else if(sel.value==='wink'){
            document.getElementById('login_mode').value='otp';
        }
    }
    sel.addEventListener('change',toggleWink);
    toggleWink();
})();
</script>
{% endblock %}
